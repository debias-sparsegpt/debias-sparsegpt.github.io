<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 260" role="img" aria-labelledby="title desc">
<title id="title">Debias-SparseGPT - EMNLP 2026</title>
<desc id="desc">Circular green emblem with Debias-SparseGPT and EMNLP 2026 lettering around a sparse neural-network tree whose branches draw themselves on load.</desc>
<defs>
  <path id="topArc" d="M 26,130 A 104,104 0 0 1 234,130"/>
  <path id="bottomArc" d="M 43,181 Q 130,269 217,181"/>
  <style>
    .logo-bg{fill:#173e33}
    .outer-ring{fill:none;stroke:#83bb9e;stroke-width:1.25;opacity:.55}
    .inner-ring{fill:none;stroke:#36755a;stroke-width:1;opacity:.52}
    .branch-main,.branch-sub{fill:none;stroke:#91d5af;stroke-linecap:round;stroke-linejoin:round;vector-effect:non-scaling-stroke}
    .branch-main{stroke-width:5.2}
    .branch-sub{stroke-width:3}
    .draw{stroke-dasharray:100;stroke-dashoffset:100;animation:draw-line 1.15s cubic-bezier(.22,.78,.24,1) forwards}
    .d2{animation-delay:.18s}
    .d3{animation-delay:.33s}
    .d4{animation-delay:.49s}
    .d5{animation-delay:.62s}
    .d6{animation-delay:.76s}
    .d7{animation-delay:.92s}
    .d8{animation-delay:1.04s}
    .d9{animation-delay:1.16s}
    .node{fill:#c2f1d4;stroke:#173e33;stroke-width:2;opacity:0;transform-box:fill-box;transform-origin:center;animation:pop-node .42s cubic-bezier(.2,.88,.28,1.24) forwards}
    .n1{animation-delay:.70s}.n2{animation-delay:.79s}.n3{animation-delay:.88s}.n4{animation-delay:.97s}.n5{animation-delay:1.06s}.n6{animation-delay:1.15s}.n7{animation-delay:1.24s}.n8{animation-delay:1.33s}.n9{animation-delay:1.42s}.n10{animation-delay:1.51s}.n11{animation-delay:1.60s}.n12{animation-delay:1.69s}.n13{animation-delay:1.78s}
    .base-line{stroke:#91d5af;stroke-width:4;stroke-linecap:round;stroke-dasharray:28;stroke-dashoffset:28;animation:draw-line .45s ease forwards;animation-delay:1.05s}
    .text-top{fill:#f3fbf5;font-family:Arial,Helvetica,sans-serif;font-size:16.7px;font-weight:700;letter-spacing:1.1px;text-anchor:middle}
    .text-bottom{fill:#9cddb9;font-family:Arial,Helvetica,sans-serif;font-size:17.3px;font-weight:700;letter-spacing:2px;text-anchor:middle}
    .soft-pulse{animation:soft-pulse 6s ease-in-out 2.2s infinite}
    @keyframes draw-line{to{stroke-dashoffset:0}}
    @keyframes pop-node{0%{opacity:0;transform:scale(.1)}70%{opacity:1;transform:scale(1.14)}100%{opacity:1;transform:scale(1)}}
    @keyframes soft-pulse{0%,100%{opacity:.52}50%{opacity:.78}}
    @media (prefers-reduced-motion: reduce){.draw,.node,.base-line,.soft-pulse{animation:none;opacity:1;stroke-dashoffset:0}}
  </style>
</defs>
<circle cx="130" cy="130" r="126" class="logo-bg"/>
<circle cx="130" cy="130" r="119" class="outer-ring soft-pulse"/>
<circle cx="130" cy="130" r="79" class="inner-ring soft-pulse"/>
<text class="text-top"><textPath href="#topArc" startOffset="50%">DEBIAS-SPARSEGPT</textPath></text>
<text class="text-bottom"><textPath href="#bottomArc" startOffset="50%">EMNLP 2026</textPath></text>
<g>
  <path class="branch-main draw" pathLength="100" d="M 130,187 V 118"/>
  <path class="branch-main draw d2" pathLength="100" d="M 130,151 L 105,126 L 87,103"/>
  <path class="branch-main draw d3" pathLength="100" d="M 130,136 L 158,112 L 171,91"/>
  <path class="branch-main draw d4" pathLength="100" d="M 130,167 L 158,146 L 181,145"/>
  <path class="branch-main draw d5" pathLength="100" d="M 130,123 L 130,92 L 111,74"/>
  <path class="branch-main draw d6" pathLength="100" d="M 130,116 L 150,84"/>
  <path class="branch-sub draw d3" pathLength="100" d="M 105,126 L 78,126 L 68,114"/>
  <path class="branch-sub draw d4" pathLength="100" d="M 105,126 L 106,100"/>
  <path class="branch-sub draw d6" pathLength="100" d="M 158,112 L 181,111 L 189,98"/>
  <path class="branch-sub draw d7" pathLength="100" d="M 158,112 L 158,89"/>
  <path class="branch-sub draw d8" pathLength="100" d="M 130,92 L 138,72"/>
  <path class="branch-sub draw d9" pathLength="100" d="M 158,146 L 175,165"/>
</g>
<g>
  <circle class="node n1" cx="87" cy="103" r="6"/>
  <circle class="node n2" cx="68" cy="114" r="5"/>
  <circle class="node n3" cx="106" cy="100" r="5"/>
  <circle class="node n4" cx="111" cy="74" r="5"/>
  <circle class="node n5" cx="138" cy="72" r="6"/>
  <circle class="node n6" cx="150" cy="84" r="5"/>
  <circle class="node n7" cx="171" cy="91" r="6"/>
  <circle class="node n8" cx="158" cy="89" r="5"/>
  <circle class="node n9" cx="189" cy="98" r="5"/>
  <circle class="node n10" cx="181" cy="111" r="5"/>
  <circle class="node n11" cx="181" cy="145" r="6"/>
  <circle class="node n12" cx="175" cy="165" r="5"/>
  <circle class="node n13" cx="78" cy="126" r="5"/>
</g>
<path class="base-line" d="M 116,190 H 144"/>
</svg>
